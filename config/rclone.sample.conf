# Заготовка транспорта / transport template
#
# Рабочий файл живёт в config\rclone\rclone.conf и в историю не попадает:
# папка config\rclone закрыта целиком, потому что рядом лежат ключи. Здесь -
# её форма без единого значения. Собрать рабочий файл из этой заготовки умеет
# само окно: раздел SETUP, кнопка ТРАНСПОРТ.
#
# The working file lives in config\rclone\rclone.conf and never reaches
# history: the whole config\rclone folder is closed, because keys live there.
# The window builds the working file from this template: section SETUP.
#
# Метки в двойных фигурных скобках подставляет мастер. Что не подставилось -
# так и останется в файле меткой: недособранный транспорт виден сразу, а не
# через час поисков, почему панель молчит.
#
#   {{R2_ACCOUNT}}       идентификатор учётной записи Cloudflare
#   {{R2_PROFILE}}       имя профиля в r2.credentials
#   {{BASE_ADDRESS}}     адрес стационара в домашней сети
#   {{BASE_USER}}        учётная запись на нём
#   {{HOME_ADDRESS}}     адрес машины HOME, за роутером HOME
#   {{HOME_USER}}        учётная запись на ней
#   {{DAD_ADDRESS}}      адрес машины DAD
#   {{DAD_USER}}         учётная запись на DAD
#   {{WORK_ADDRESS}}     адрес рабочей машины: тот, по которому она видна отсюда
#   {{WORK_USER}}        учётная запись на рабочей машине
#   {{LAPTOP_ADDRESS}}   адрес лэптопа в домашней сети
#   {{LAPTOP_USER}}      учётная запись на нём
#   {{MACHINE_KEY}}      ключ, которым ходим на домашние машины
#   {{SERVER_ADDRESS}}   адрес MAIN VPS
#   {{SERVER_USER}}      учётная запись на MAIN VPS
#   {{SERVER_KEY}}       ключ от MAIN VPS
#   {{SERVER_SSH_HOST}}  имя запасного хода из ~\.ssh\config (поверх cloudflared)
#   {{SECOND_SSH_HOST}}    имя SECOND VPS из ~\.ssh\config
#   {{SECOND_SSH_HOST_CF}} оно же поверх cloudflared
#   {{KNOWN_HOSTS}}      свой список ключей машин
#
# Ключи к R2 bucket сюда не пишутся никогда. Их место - r2.credentials рядом,
# и вносит их окно: раздел SETUP, кнопка КЛЮЧИ R2.

# --- R2 bucket ---------------------------------------------------------------
# env_auth=true: ключи читаются из r2.credentials по переменной окружения
# AWS_SHARED_CREDENTIALS_FILE, которую окно ставит на время вызова.
# no_check_bucket: токен с правами на объекты не умеет спрашивать о самом
# бакете, и без этого rclone спотыкался бы на первой же заливке.
[r2]
type = s3
provider = Cloudflare
region = auto
env_auth = true
no_check_bucket = true
profile = {{R2_PROFILE}}
endpoint = https://{{R2_ACCOUNT}}.r2.cloudflarestorage.com

# --- машины дома -------------------------------------------------------------
# Windows-машины: оболочка powershell, суммы отключены - их считает не та
# сторона, и rclone тратил бы на это минуты.
[base]
type = sftp
host = {{BASE_ADDRESS}}
port = {{BASE_PORT}}
user = {{BASE_USER}}
key_file = {{MACHINE_KEY}}
shell_type = powershell
known_hosts_file = {{KNOWN_HOSTS}}
md5sum_command = none
sha1sum_command = none

[laptop]
type = sftp
host = {{LAPTOP_ADDRESS}}
port = {{LAPTOP_PORT}}
user = {{LAPTOP_USER}}
key_file = {{MACHINE_KEY}}
shell_type = powershell
known_hosts_file = {{KNOWN_HOSTS}}
md5sum_command = none
sha1sum_command = none

# Рабочая машина. Дальних маршрутов у неё нет: панель ходит прямо по её адресу и
# отвечает, когда этот адрес виден отсюда.
[work]
type = sftp
host = {{WORK_ADDRESS}}
port = {{WORK_PORT}}
user = {{WORK_USER}}
key_file = {{MACHINE_KEY}}
shell_type = powershell
known_hosts_file = {{KNOWN_HOSTS}}
md5sum_command = none
sha1sum_command = none

# HOME: прямой адрес. Для доступа через SECOND VPS есть отдельный home-via.
[home]
type = sftp
host = {{HOME_ADDRESS}}
port = {{HOME_PORT}}
user = {{HOME_USER}}
key_file = {{MACHINE_KEY}}
shell_type = powershell
known_hosts_file = {{KNOWN_HOSTS}}
md5sum_command = none
sha1sum_command = none

[dad]
type = sftp
host = {{DAD_ADDRESS}}
port = {{DAD_PORT}}
user = {{DAD_USER}}
key_file = {{MACHINE_KEY}}
shell_type = powershell
known_hosts_file = {{KNOWN_HOSTS}}
md5sum_command = none
sha1sum_command = none

# Дальние маршруты до тех же машин. Прыжок через посредника нельзя описать
# адресом: ProxyJump живёт в ~\.ssh\config и известен только самому ssh,
# поэтому здесь rclone зовёт ssh готовым именем хоста.
[home-via]
type = sftp
ssh = ssh -o BatchMode=yes -o ConnectTimeout=20 home
shell_type = powershell
disable_hashcheck = true

[dad-via]
type = sftp
ssh = ssh -o BatchMode=yes -o ConnectTimeout=20 dad
shell_type = powershell
disable_hashcheck = true

[base-via]
type = sftp
ssh = ssh base
shell_type = powershell
md5sum_command = none
sha1sum_command = none

[laptop-via]
type = sftp
ssh = ssh laptop
shell_type = powershell
md5sum_command = none
sha1sum_command = none

[base-cf]
type = sftp
ssh = ssh base-cf
shell_type = powershell
md5sum_command = none
sha1sum_command = none

[laptop-cf]
type = sftp
ssh = ssh laptop-cf
shell_type = powershell
md5sum_command = none
sha1sum_command = none

[base-direct]
type = sftp
ssh = ssh base-direct
shell_type = powershell
md5sum_command = none
sha1sum_command = none

[laptop-direct]
type = sftp
ssh = ssh laptop-direct
shell_type = powershell
md5sum_command = none
sha1sum_command = none

# --- MAIN VPS ------------------------------------------------------------------
# Родной sftp самого rclone, а не внешний ssh: с внешним соединение не
# поднималось вовсе и панель висела до таймаута. Ключи хоста берутся из
# своего списка - в профиле пользователя записан только один их тип, а
# rclone договаривается и на другой, и выходил «key mismatch» на ровном месте.
[server]
type = sftp
host = {{SERVER_ADDRESS}}
port = {{SERVER_PORT}}
user = {{SERVER_USER}}
key_file = {{SERVER_KEY}}
shell_type = unix
known_hosts_file = {{KNOWN_HOSTS}}

# Запасной маршрут к нему же - поверх cloudflared: открытого порта у него нет,
# и блокировать в нём нечего. Имя хоста описано в ~\.ssh\config.
[server-cf]
type = sftp
ssh = ssh -o BatchMode=yes -o ConnectTimeout=20 {{SERVER_SSH_HOST}}
shell_type = unix

# --- SECOND VPS ----------------------------------------------------
# Учётная запись и ключ не выписаны здесь намеренно: имя хоста SECOND VPS
# описано в ~\.ssh\config, оттуда ssh их и берёт. Меньше мест, где править одно
# и то же. Из дома этот маршрут идёт напрямую, без VPN. Меток в пояснениях не
# ставим: незаполненная осталась бы в рабочем файле и выдала бы его за
# недособранный, даже когда рабочая строка сохранена.
[second]
type = sftp
ssh = ssh -o BatchMode=yes -o ConnectTimeout=20 {{SECOND_SSH_HOST}}
shell_type = unix
md5sum_command = md5sum
sha1sum_command = sha1sum

# Та же машина поверх cloudflared - на случай сетей, где её ssh режут.
[second-cf]
type = sftp
ssh = ssh -o BatchMode=yes -o ConnectTimeout=20 {{SECOND_SSH_HOST_CF}}
shell_type = unix
md5sum_command = md5sum
sha1sum_command = sha1sum
