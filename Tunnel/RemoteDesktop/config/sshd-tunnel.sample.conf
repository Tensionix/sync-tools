# Ограничения учётной записи tunnel на MAIN VPS и SECOND VPS.
#
# Под этой учётной записью живут ключи REVERSE SSH TUN: машина, до которой
# снаружи не достучаться, держит одно исходящее соединение и просит сервер
# открыть у себя порт на петле. Больше ей ничего не нужно.
#
# Ключ такой машины лежит на самой машине - в чужой сети, в поездке, за
# корпоративным фаерволом. Если его украдут, эти строки решают, что с ним
# можно сделать на сервере: поднять обратный проброс на петле и ничего больше.
#
# Опции в самой строке ключа (их пишет Setup-SshBeacon.ps1) сужают проброс до
# одного порта. Здесь - второй рубеж, на случай если строку ключа однажды
# запишут без них.
#
# КУДА: в конец /etc/ssh/sshd_config, последним блоком. Не в каталог
# дополнений: файлы оттуда подключаются в начале конфига, и Match из них
# способен захватить настройки, идущие ниже, - у root они изменились бы вместе
# с ними. В конце главного файла такого не бывает.
#
# ПОСЛЕ: sshd -t, затем сверка действующих настроек для tunnel, root и audion,
# и только потом перезагрузка конфигурации (reload, не restart).

Match User tunnel
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    PermitListen 127.0.0.1:*
    PermitOpen none
    PermitTunnel no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /bin/false
